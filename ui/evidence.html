<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ORACLE Evidence Cockpit</title>
  <style>
    :root {
      --bg:#090d0f; --ink:#e8edf0; --muted:#8b99a1; --line:rgba(255,255,255,.1);
      --panel:#11181b; --panel2:#151f23; --cyan:#58d0c8; --amber:#e6b65f;
      --green:#7ad58f; --red:#ee7f78; --violet:#a78bfa;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
    body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    a{color:inherit}
    .shell{max-width:1500px;margin:0 auto;padding:22px 24px 54px}
    nav{display:flex;align-items:center;gap:12px;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:12px}
    .mark{width:34px;height:34px;border:1px solid rgba(88,208,200,.52);border-radius:8px;display:grid;place-items:center;color:var(--cyan);font-weight:800}
    .eyebrow{font:10px ui-monospace,SFMono-Regular,Consolas,monospace;text-transform:uppercase;letter-spacing:.16em;color:var(--muted)}
    h1{font-size:28px;line-height:1.1;margin:2px 0 0}
    .links{display:flex;gap:8px;flex-wrap:wrap}
    .links a,.refresh{border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--muted);padding:7px 10px;text-decoration:none;font-size:12px;cursor:pointer}
    .links a:hover,.refresh:hover{color:var(--ink);border-color:rgba(88,208,200,.42)}
    .hero{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;margin-top:20px}
    .band,.panel{border:1px solid var(--line);background:var(--panel);border-radius:8px}
    .band{padding:18px}
    .band h2,.panel h2{margin:0 0 10px;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--cyan)}
    .definition{font-size:24px;line-height:1.35;max-width:940px;margin:0}
    .meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
    .metric{border:1px solid var(--line);border-radius:8px;background:var(--panel2);padding:12px;min-height:78px}
    .metric span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
    .metric b{display:block;margin-top:8px;font-size:25px;color:var(--amber);font-weight:650}
    .contract{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
    .contract div{border:1px solid var(--line);border-radius:6px;background:rgba(255,255,255,.025);padding:8px 9px;color:#c8d0d4;font-size:12px}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
    .panel{padding:14px;min-height:180px}
    .surface-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
    .surface-title{font-size:17px;font-weight:700}
    .pill{border:1px solid rgba(122,213,143,.42);color:var(--green);border-radius:999px;padding:4px 7px;font:10px ui-monospace,Consolas,monospace;text-transform:uppercase;white-space:nowrap}
    .pill.missing,.pill.error{border-color:rgba(238,127,120,.5);color:var(--red)}
    .pill.available_with_holes{border-color:rgba(230,182,95,.52);color:var(--amber)}
    .records{font-size:36px;line-height:1;margin:20px 0 6px;color:var(--ink)}
    .label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
    .path{margin-top:12px;color:#aeb9bf;font:11px ui-monospace,Consolas,monospace;overflow-wrap:anywhere}
    .boundary{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;color:var(--muted);font-size:12px;line-height:1.4}
    .details{margin-top:10px;color:#b9c2c7;font:11px ui-monospace,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:150px;overflow:auto}
    .holes{margin-top:14px;border:1px solid rgba(230,182,95,.28);border-radius:8px;background:rgba(230,182,95,.045);padding:13px}
    .holes h2{color:var(--amber)}
    .hole-row{font:12px ui-monospace,Consolas,monospace;color:#dbc89e;padding:5px 0;border-bottom:1px solid rgba(230,182,95,.12)}
    .hole-row:last-child{border-bottom:0}
    .answer{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
    textarea{width:100%;min-height:110px;resize:vertical;border:1px solid var(--line);border-radius:8px;background:#071012;color:var(--ink);padding:10px;font:13px ui-monospace,Consolas,monospace}
    .buttonrow{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
    button{border:1px solid var(--line);border-radius:6px;background:var(--panel2);color:var(--ink);padding:8px 10px;cursor:pointer}
    button.primary{border-color:rgba(88,208,200,.48);color:var(--cyan)}
    pre{margin:0;border:1px solid var(--line);border-radius:8px;background:#071012;color:#c7d2d8;padding:12px;min-height:160px;overflow:auto;font-size:11px}
    @media(max-width:980px){.hero,.answer{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.meta{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
<main class="shell">
  <nav>
    <div class="brand">
      <div class="mark">O</div>
      <div><div class="eyebrow">Proof-of-use layer</div><h1>Evidence Cockpit</h1></div>
    </div>
    <div class="links">
      <a href="/">Conversation</a>
      <a href="/nexus">Nexus</a>
      <a href="/console">Console</a>
      <button class="refresh" onclick="loadCockpit()">Refresh</button>
    </div>
  </nav>

  <section class="hero">
    <div class="band">
      <h2>Mission</h2>
      <p class="definition" id="definition">Loading read-only evidence manifest...</p>
      <div class="meta">
        <div class="metric"><span>Surfaces</span><b id="surface-count">-</b></div>
        <div class="metric"><span>Available</span><b id="available-count">-</b></div>
        <div class="metric"><span>Open Holes</span><b id="hole-count">-</b></div>
        <div class="metric"><span>Sandbox</span><b id="sandbox-state">No</b></div>
      </div>
    </div>
    <div class="band">
      <h2>Answer Contract</h2>
      <div class="contract" id="contract"></div>
      <div class="boundary" id="next-action"></div>
    </div>
  </section>

  <section class="grid" id="surfaces"></section>

  <section class="holes">
    <h2>Preserved Holes</h2>
    <div id="holes"></div>
  </section>

  <section class="answer">
    <div class="band">
      <h2>Turn Evidence Preview</h2>
      <textarea id="turn-text">What did ORACLE use to answer this?</textarea>
      <div class="buttonrow">
        <button class="primary" onclick="previewTurn()">Preview Evidence</button>
        <button onclick="document.getElementById('turn-text').value=''">Clear</button>
      </div>
    </div>
    <pre id="turn-output">No turn preview yet.</pre>
  </section>
</main>

<script>
const esc = value => String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const api = path => window.location.origin + path;

function compactDetails(details) {
  if (!details) return '';
  return JSON.stringify(details, null, 2);
}

function renderSurface(item) {
  const statusClass = esc(item.status || 'unknown');
  const source = item.source || {};
  return `<article class="panel">
    <div class="surface-head">
      <div class="surface-title">${esc(item.label)}</div>
      <div class="pill ${statusClass}">${esc(item.status)}</div>
    </div>
    <div class="records">${Number(item.records || 0).toLocaleString()}</div>
    <div class="label">Enumerable records</div>
    <div class="path">${esc(source.path || 'no source path')}</div>
    <div class="boundary">${esc(item.boundary || 'read-only')}</div>
    <div class="details">${esc(compactDetails(item.details))}</div>
  </article>`;
}

async function loadCockpit() {
  const response = await fetch(api('/api/evidence-cockpit'), { cache: 'no-store' });
  const data = await response.json();
  if (!response.ok || !data.ok) throw new Error(data.error || `HTTP ${response.status}`);
  document.getElementById('definition').textContent = data.definition;
  document.getElementById('surface-count').textContent = data.surface_count;
  document.getElementById('available-count').textContent = data.available_surface_count;
  document.getElementById('hole-count').textContent = (data.holes || []).length;
  document.getElementById('sandbox-state').textContent = data.boundaries && data.boundaries.sandbox_touched ? 'Yes' : 'No';
  document.getElementById('surfaces').innerHTML = data.surfaces.map(renderSurface).join('');
  document.getElementById('contract').innerHTML = Object.entries(data.current_answer_contract || {})
    .map(([key, value]) => `<div>${esc(key.replaceAll('_',' '))}: ${value ? 'yes' : 'no'}</div>`).join('');
  document.getElementById('holes').innerHTML = (data.holes || []).length
    ? data.holes.map(h => `<div class="hole-row">${esc(h.surface)}: ${esc(h.status)}</div>`).join('')
    : '<div class="hole-row">none reported</div>';
  document.getElementById('next-action').textContent = data.next_best_action || '';
}

async function previewTurn() {
  const text = document.getElementById('turn-text').value;
  const response = await fetch(api('/api/evidence-cockpit/turn'), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: text, mode: 'talk_lane', effective_route: 'preview' })
  });
  const data = await response.json();
  document.getElementById('turn-output').textContent = JSON.stringify(data, null, 2);
}

loadCockpit().catch(error => {
  document.getElementById('definition').textContent = 'Evidence cockpit unavailable: ' + error.message;
});
</script>
</body>
</html>
